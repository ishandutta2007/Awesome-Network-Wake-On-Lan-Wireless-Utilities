<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00c6ff"/></linearGradient><radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".6"/><stop offset="60%" stop-color="#0077b6" stop-opacity=".2"/><stop offset="100%" stop-color="#0d1b2a" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f293d" stroke-width=".8" d="M 40 0 L 0 0 0 40" opacity=".6"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes ripple{0%{r:10px;opacity:.9}50%{opacity:.5}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}@keyframes pulsePacket{0%{stroke-dashoffset:400;opacity:.2}50%{opacity:1}}.radar-arm{transform-origin:1050px 180px;animation:radarSweep 8s linear infinite}.ripple-1,.ripple-2,.ripple-3{animation:ripple 3.5s cubic-bezier(.1,.8,.3,1) infinite}.ripple-2{animation-delay:1.2s}.ripple-3{animation-delay:2.4s}.particle-float{animation:floatParticle 5s ease-in-out infinite}.packet-flow{stroke-dasharray:12 16;animation:pulsePacket 4s linear infinite}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400}.pill-text{font-size:13px;font-weight:600;letter-spacing:.5px}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#grid)"/><g opacity=".85"><circle cx="1040" cy="180" r="140" fill="url(#pulseGlow)"/><circle cx="1040" cy="180" r="20" fill="none" stroke="#00f2fe" stroke-width="2.5" class="ripple-1" opacity=".8"/><circle cx="1040" cy="180" r="20" fill="none" stroke="#4facfe" stroke-width="2" class="ripple-2" opacity=".6"/><circle cx="1040" cy="180" r="20" fill="none" stroke="#38ef7d" stroke-width="1.5" class="ripple-3" opacity=".4"/><circle cx="1040" cy="180" r="6" fill="#00f2fe" filter="url(#glow)"/><circle cx="1040" cy="180" r="18" fill="none" stroke="#00f2fe" stroke-dasharray="3 3" stroke-width="1.5"/><g class="radar-arm"><line x1="1050" x2="1190" y1="180" y2="180" stroke="url(#accentGrad)" stroke-width="2" opacity=".5"/></g><path fill="none" stroke="#00f2fe" stroke-width="2.5" d="M 80 290 L 320 290 L 460 320 L 780 320 L 920 240 L 1040 180" class="packet-flow" opacity=".6"/><path fill="none" stroke="#38ef7d" stroke-width="2" d="M 220 50 L 520 50 L 680 90 L 880 90 L 1040 180" class="packet-flow" opacity=".5" style="animation-delay:1.5s"/><path fill="none" stroke="#4facfe" stroke-width="2" d="M 120 180 L 400 180 L 560 220 L 820 220 L 1040 180" class="packet-flow" opacity=".4" style="animation-delay:.8s"/><g class="particle-float"><circle cx="320" cy="290" r="4.5" fill="#00f2fe" filter="url(#glow)"/><circle cx="520" cy="50" r="4.5" fill="#38ef7d" filter="url(#glow)"/><circle cx="780" cy="320" r="5" fill="#4facfe" filter="url(#glow)"/><circle cx="880" cy="90" r="4.5" fill="#00f2fe" filter="url(#glow)"/><circle cx="560" cy="220" r="4" fill="#38ef7d" filter="url(#glow)"/></g></g><g><g transform="translate(60, 0) translate(0, 48)"><rect width="250" height="28" fill="#112240" stroke="#00f2fe" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="5" fill="#38ef7d"/><text x="30" y="19" fill="#00f2fe" class="pill-text">WAKE-ON-LAN &amp; WIRELESS</text></g><text x="0" y="132" fill="#fff" class="title-text" font-size="44" transform="translate(60, 0)">Network Wake-on-LAN &amp;</text><text x="0" y="184" fill="url(#accentGrad)" class="title-text" filter="url(#glow)" font-size="44" transform="translate(60, 0)">Wireless Utilities</text><text x="0" y="228" fill="#94a3b8" class="subtitle-text" font-size="16" transform="translate(60, 0)">Curated Magic Packet (WoL) dispatchers, Bluetooth proximity triggers,</text><text x="0" y="252" fill="#94a3b8" class="subtitle-text" font-size="16" transform="translate(60, 0)">self-hosted RMM controllers, out-of-band IP-KVM power hubs &amp; homelab automation.</text><g><g transform="translate(60, 0) translate(0, 280) translate(0, 0)"><rect width="138" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="6"/><text x="14" y="21" fill="#38ef7d" class="pill-text">⚡ UDP 7/9 Magic</text></g><g transform="translate(60, 0) translate(0, 280) translate(150, 0)"><rect width="148" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="6"/><text x="14" y="21" fill="#38bdf8" class="pill-text">📶 Wake-on-WLAN</text></g><g transform="translate(60, 0) translate(0, 280) translate(310, 0)"><rect width="138" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="6"/><text x="14" y="21" fill="#a78bfa" class="pill-text">🖥️ Out-of-Band</text></g><g transform="translate(60, 0) translate(0, 280) translate(460, 0)"><rect width="144" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="6"/><text x="14" y="21" fill="#f43f5e" class="pill-text">🛡️ Zero-Trust VPN</text></g></g></g></svg>