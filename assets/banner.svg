<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Radar Pulse Wave Gradient -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0077b6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ripple {
        0% { r: 10px; opacity: 0.9; }
        50% { opacity: 0.5; }
        100% { r: 140px; opacity: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
      }
      @keyframes pulsePacket {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      .radar-arm {
        transform-origin: 1050px 180px;
        animation: radarSweep 8s linear infinite;
      }
      .ripple-1 {
        animation: ripple 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .ripple-2 {
        animation: ripple 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        animation-delay: 1.2s;
      }
      .ripple-3 {
        animation: ripple 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        animation-delay: 2.4s;
      }
      .particle-float {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .packet-flow {
        stroke-dasharray: 12 16;
        animation: pulsePacket 4s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Dynamic Background / Wireless Waves & Magic Packet Nodes -->
  <g opacity="0.85">
    <!-- Center of Wireless Transmission (Right side: 1040, 180) -->
    <circle cx="1040" cy="180" r="140" fill="url(#pulseGlow)" />
    
    <!-- Concentric Expanding Wave Rings -->
    <circle class="ripple-1" cx="1040" cy="180" r="20" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
    <circle class="ripple-2" cx="1040" cy="180" r="20" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.6" />
    <circle class="ripple-3" cx="1040" cy="180" r="20" fill="none" stroke="#38ef7d" stroke-width="1.5" opacity="0.4" />
    
    <circle cx="1040" cy="180" r="6" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="1040" cy="180" r="18" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Radar Sweep Effect -->
    <g class="radar-arm">
      <line x1="1050" y1="180" x2="1190" y2="180" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5" />
    </g>

    <!-- Network Circuit / Packet Transmission Lines -->
    <path class="packet-flow" d="M 80 290 L 320 290 L 460 320 L 780 320 L 920 240 L 1040 180" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.6" />
    <path class="packet-flow" d="M 220 50 L 520 50 L 680 90 L 880 90 L 1040 180" fill="none" stroke="#38ef7d" stroke-width="2" opacity="0.5" style="animation-delay: 1.5s;" />
    <path class="packet-flow" d="M 120 180 L 400 180 L 560 220 L 820 220 L 1040 180" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.4" style="animation-delay: 0.8s;" />

    <!-- Floating Network Nodes (Packets / Routers) -->
    <g class="particle-float">
      <circle cx="320" cy="290" r="4.5" fill="#00f2fe" filter="url(#glow)" />
      <circle cx="520" cy="50" r="4.5" fill="#38ef7d" filter="url(#glow)" />
      <circle cx="780" cy="320" r="5" fill="#4facfe" filter="url(#glow)" />
      <circle cx="880" cy="90" r="4.5" fill="#00f2fe" filter="url(#glow)" />
      <circle cx="560" cy="220" r="4" fill="#38ef7d" filter="url(#glow)" />
    </g>
  </g>

  <!-- Foreground Content: Titles, Subtitle, and Feature Pills (Guaranteed completely visible and crisp) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 48)">
      <rect width="250" height="28" rx="14" fill="#112240" stroke="#00f2fe" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#38ef7d" />
      <text x="30" y="19" fill="#00f2fe" class="pill-text">WAKE-ON-LAN &amp; WIRELESS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-size="44" class="title-text">
      Network Wake-on-LAN &amp;
    </text>
    <text x="0" y="184" fill="url(#accentGrad)" font-size="44" class="title-text" filter="url(#glow)">
      Wireless Utilities
    </text>

    <!-- Subtitle -->
    <text x="0" y="228" fill="#94a3b8" font-size="16" class="subtitle-text">
      Curated Magic Packet (WoL) dispatchers, Bluetooth proximity triggers,
    </text>
    <text x="0" y="252" fill="#94a3b8" font-size="16" class="subtitle-text">
      self-hosted RMM controllers, out-of-band IP-KVM power hubs &amp; homelab automation.
    </text>

    <!-- Feature Badge Pills -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21" fill="#38ef7d" class="pill-text">⚡ UDP 7/9 Magic</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="148" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21" fill="#38bdf8" class="pill-text">📶 Wake-on-WLAN</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect width="138" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21" fill="#a78bfa" class="pill-text">🖥️ Out-of-Band</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(460, 0)">
        <rect width="144" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21" fill="#f43f5e" class="pill-text">🛡️ Zero-Trust VPN</text>
      </g>
    </g>
  </g>
</svg>
